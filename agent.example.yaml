# Copy to /data/agent.yaml and set permissions to 0600.
# The dedicated instance token is issued by S5M Master for this machine code, Agent type and instance ID.
# After first successful registration, wg-agent stores the JWT in this file and
# removes the one-time secret automatically.
controllerURL: https://bind.v2net.cc
machineCode: REPLACE_WITH_MACHINE_CODE
agentType: wireguard
instanceID: REPLACE_WITH_WIREGUARD_INSTANCE_ID
secret: REPLACE_WITH_DEDICATED_AGENT_TOKEN
