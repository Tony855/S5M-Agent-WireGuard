name: WireGuard multi-arch image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wireguard-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test AMD64 and ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: s5m-agent-wireguard:ci
      - name: Build and smoke-test AMD64
        run: |
          docker buildx build --platform linux/amd64 --load -t s5m-agent-wireguard:amd64 .
          test "$(docker run --rm --entrypoint /usr/local/bin/wg-agent s5m-agent-wireguard:amd64 version)" != ""
      - name: Build and smoke-test ARM64
        run: |
          docker buildx build --platform linux/arm64 --load -t s5m-agent-wireguard:arm64 .
          test "$(docker run --rm --entrypoint /usr/local/bin/wg-agent s5m-agent-wireguard:arm64 version)" != ""
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tony855/s5m-agent-wireguard:latest
            ghcr.io/tony855/s5m-agent-wireguard:${{ github.sha }}
