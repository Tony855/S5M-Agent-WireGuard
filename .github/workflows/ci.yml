name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              echo "::error file=$file,title=Go formatting::Run gofmt -w $file"
            done <<< "$files"
            exit 1
          fi
